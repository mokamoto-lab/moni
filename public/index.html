<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moni</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#191919">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #191919;
      --muted: #6b6b6b;
      --card: #f7f7f5;
      --border: #e5e5e3;
      --accent: #2383e2;
      --ok: #0f7b6c;
      --err: #d44c47;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #191919;
        --fg: #ebebeb;
        --muted: #9b9b9b;
        --card: #252525;
        --border: #373737;
        --accent: #529cca;
        --ok: #4dab9a;
        --err: #ff7369;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { width: 100%; max-width: 420px; display: grid; gap: 16px; }
    h1 { margin: 0; font-size: 1.5rem; }
    p { margin: 0; color: var(--muted); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: grid;
      gap: 6px;
      font-variant-numeric: tabular-nums;
    }
    .row { display: flex; justify-content: space-between; gap: 12px; }
    .row span:first-child { color: var(--muted); }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--fg);
      font: inherit;
    }
    textarea { resize: vertical; min-height: 64px; }
    button {
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: progress; }
    #status { min-height: 1.5em; }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--err); }
    #status a { color: inherit; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div>
      <h1>📍 Moni</h1>
      <p>Capture where you are and log it to Notion.</p>
    </div>

    <div class="card" id="reading" hidden>
      <div class="row"><span>Latitude</span><span id="lat"></span></div>
      <div class="row"><span>Longitude</span><span id="lng"></span></div>
      <div class="row"><span>Accuracy</span><span id="acc"></span></div>
    </div>

    <input id="password" type="password" placeholder="App password" autocomplete="current-password" hidden>
    <textarea id="note" placeholder="Note (optional)"></textarea>
    <button id="send">Send my location to Notion</button>
    <p id="status" role="status"></p>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const button = $("send");
    const status = $("status");

    function setStatus(text, kind = "") {
      status.className = kind;
      status.textContent = text;
    }

    function getPosition() {
      return new Promise((resolve, reject) => {
        if (!("geolocation" in navigator)) {
          reject(new Error("This browser doesn't support location."));
          return;
        }
        navigator.geolocation.getCurrentPosition(resolve, reject, {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 0,
        });
      });
    }

    function describeGeoError(err) {
      if (err.code === 1) return "Location permission was denied. Allow it in your browser settings and try again.";
      if (err.code === 2) return "Your location couldn't be determined.";
      if (err.code === 3) return "Timed out while getting your location.";
      return err.message;
    }

    async function sendLocation() {
      button.disabled = true;
      try {
        setStatus("Getting your location…");
        let pos;
        try {
          pos = await getPosition();
        } catch (err) {
          throw new Error(describeGeoError(err));
        }

        const { latitude, longitude, accuracy } = pos.coords;
        $("lat").textContent = latitude.toFixed(6);
        $("lng").textContent = longitude.toFixed(6);
        $("acc").textContent = `±${Math.round(accuracy)} m`;
        $("reading").hidden = false;

        setStatus("Sending to Notion…");
        const res = await fetch("/api/location", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-App-Password": $("password").value,
          },
          body: JSON.stringify({
            latitude,
            longitude,
            accuracy,
            capturedAt: new Date(pos.timestamp).toISOString(),
            note: $("note").value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);

        try { localStorage.setItem("moni-password", $("password").value); } catch {}
        $("note").value = "";
        status.className = "ok";
        status.innerHTML = 'Saved to Notion ✓ <a target="_blank" rel="noopener">Open page</a>';
        status.querySelector("a").href = data.url;
      } catch (err) {
        setStatus(err.message, "err");
      } finally {
        button.disabled = false;
      }
    }

    button.addEventListener("click", sendLocation);

    fetch("/api/config")
      .then((r) => r.json())
      .then(({ passwordRequired }) => {
        $("password").hidden = !passwordRequired;
        try { $("password").value = localStorage.getItem("moni-password") || ""; } catch {}
      })
      .catch(() => {});
  </script>
</body>
</html>
